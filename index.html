<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      Telegram.WebApp.expand();
    </script>
  </head>
  <body style="width:100vw;height:1000px;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
  
    <div id="root"></div>

    <div>TMA V 2.7</div>
    <div id="fixed" type="text" style="width:100%;padding:0;margin:0;bacckground:white"></div>
    <div id="movel" type="text" style="width:100%;padding:0;margin:0" onclick="window.location.href='https://checkinview.com'">CV Site</div>
     
    <iframe style="width:100vw;height:56.25vw" src="https://www.youtube.com/embed/ELjzrNXhAlk?&autoplay=1"frameborder="0" allowfullscreen></iframe>
    <div  type="text" style="width:100%;padding:0;margin:0;background:white">Console<br><span id="con"></span></div>
    <div  type="text" style="width:100%;padding:0;margin:0;background:white">Geolocation<br><span id="geo"></span></div>
    <div type="text" style="width:100%;padding:0;margin:0;background:white">Message<br><span id="msg"></span></div>
    <script>
      let tg = Telegram.WebApp;
      console.log('SVXTMA connectedCallBack', tg);
      let con = document.getElementById("con");
      con.innerText =   "isExpanded? " + tg.isExpanded;
      let geo = document.getElementById("geo");
      let msg = document.getElementById("msg");
      msg.innerText = JSON.stringify(tg.initData);

      tg.LocationManager.init(() =>  {
        if (tg.LocationManager.isInited && tg.LocationManager.isLocationAvailable) {
          console.log("Location tracking initialized successfully!");
          tg.LocationManager.getLocation(data =>  {
            if (data) {
              geo.innerText = `Local: Lat= ${data.latitude} , Lon = ${data.longitude}`;
              console.log("Geo Data", data);
            }
          });
        } else { console.log("Location services are unavailable or permission was denied.")}
      });
    
      tg.expand();
      tg.ready();
      tg.expand();
      tg.showAlert(Telegram.WebApp.isExpanded);
      tg.setHeaderColor('#FF8303');
      tg.BackButton.show();
      tg.BackButton.onClick(data => {  // Your back navigation logic here
        console.log("BackButton cliked", data);
        tg.BackButton.hide();
      });  
        
    </script>
  </body>
</html>
