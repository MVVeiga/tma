<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script> Telegram.WebApp.expand();</script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"/>

    <style>
      html,
      body { position: relative; height: 100%;}
      body { background: #000;  font-family: Helvetica Neue,Helvetica,Arial,sans-serif; font-size: 14px;color: #fff;margin: 0;padding: 0;}
      .swiper { width: 100%; height: auto; }
      .swiper-slide {text-align: center; font-size: 18px; background: grey;width:100%}
      .swiper .swiper-slide { height: 300px; line-height: 18px; }
      .swiper .swiper-slide:nth-child(2n) { height: auto; line-height1: 500px; }
    </style>
  </head>

  <body style="width:100vw;height:1000px;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
  
    <button id="but" style="width:60px;height:40px">No Radar</button>
 
    <a href="https://checkinview.com"><div>TMA V 2.25</div></a>
    <div id="fixed" type="text" style="width:100%;padding:0;margin:0;bacckground:white"></div>
    <div id="movel" type="text" style="width:100%;padding:0;margin:0" onclick="window.location.href='https://checkinview.com'">CV Site</div>
   
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">Slide 1</div>
        <div class="swiper-slide">
           <a href="https://t.me/MV_99_bot/myapp">Console</a>
           <div id="con" style="height:auto;background:green">Con</div>
           <div id="geo" style="height:auto;background:grey">Geo</div>
           <div id="msg" style="height:auto;background:blue">Msg</div>
      
        </div>
        <div class="swiper-slide">Slide 3</div>
        <div class="swiper-slide">Slide 4</div>
        <div class="swiper-slide">Slide 5</div>
        <div class="swiper-slide">Slide 6</div>
        <div class="swiper-slide">Slide 7</div>
        <div class="swiper-slide">Slide 8</div>
        <div class="swiper-slide">Slide 9</div>
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
    
    <script>
      let tg = Telegram.WebApp;
      console.log('SVXTMA connectedCallBack', tg);
      let con = document.getElementById("con");
      con.innerText =   "isExpanded? " + tg.isExpanded;
      let geo = document.getElementById("geo");
      let msg = document.getElementById("msg");
      msg.innerText = JSON.stringify(tg.initData);
      const but = document.getElementById("but");
      but.addEventListener("click", e => getLocation())
      but.focus();

      // Window Events
      window.addEventListener('blur', e => { console.log("Blured", e)});
      window.addEventListener('focus', e => { console.log("focused", e)});
      window.addEventListener('message', e => { console.log("window message", e)});
 

      // Tg Events
      tg.onEvent("popupClosed", e => {console.log("popclosed", e)});

      //Main
      let locMan = null;

      //tg.WebView.postEvent("location_requested", );
      //tg.WebView.receiveEvent("")
      function getLocation() {
        tg.LocationManager.getLocation(async data =>  {
          console.log("geo data in", data);
          if (data === null) { clearInterval(locMan.timer); locMan.timer = null; console.log("no geo data");
          } else {
            console.log("geo data", data);
            locMan = { ...data, ...locMan };
            geo.innerText = geo.innerText + `\nLocal: Lat= ${data.latitude} , Lon = ${data.longitude}, ${Date.now()}`;
            
            if (locMan.timer === null ) locMan.timer = setInterval(getLocation, 10000);
          }
        });
        console.log("locMan", locMan);
      }
      /*
      tg.LocationManager.init(() =>  {
          if (tg.LocationManager.isLocationAvailable && tg.LocationManager.isInited) {
            locMan = {ts: Date.now(), timer: null};
            console.log("call getloc 1st");
            getLocation();
          }
      });
*/
      const watchPos = pos =>  {  geo.innerText = geo.innerText + `\n WLat= ${pos.coords.latitude} , Lon = ${pos.coords.longitude}, ${Date.now()}` }
      const watchPosErr = err => {  console.log('Web Geolocation watch error:', err, Date.now()) }
      console.log("init", Date.now())
      let watchId = navigator.geolocation.watchPosition(watchPos,  watchPosErr,  {enableHighAccuracy: false, timeout: 30000,  maximumAge: 0 } );
      console.log("after", Date.now())
     //Documnets Events
      document.addEventListener("visibilitychange", e => {
        if (document.visibilityState === "hidden") {
          navigator.geolocation.clearWatch(watchId);
          console.log("docu hidden ==============", e, whatchId);
          watchId = null;
          location.timer = null} 
        else { 
          let watchId = navigator.geolocation.watchPosition(watchPos,  watchPosErr,  {enableHighAccuracy: false, timeout: 10000,  maximumAge: 0 } );
          console.log("docu show ==========", e);
        }
      });  
      
      
      tg.expand();
      //tg.showAlert("Tg popup");
      tg.setHeaderColor('#FF8303');
      tg.BackButton.show();
      tg.BackButton.onClick(data => {  console.log("BackButton cliked", data); tg.BackButton.hide(); });  
      tg.ready();  
    
      
    
      var swiper = new Swiper('.mySwiper', {
        autoHeight: true,
        spaceBetween: 20,
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
      });
    
    
    
    </script>
  </body>
</html>
