<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      window.Telegram.WebApp.showAlert('V2.2 - Header Script isExpanded? ' + Telegram.WebApp.isExpanded);
      window.Telegram.WebApp.expand();
    </script>
    <style>
.app-container {
  width: 100%;
  height: var(--tg-viewport-stable-height); /* Safe fullscreen height */
  display: flex;
  flex-direction: column;
}
  #app {
  display: flex;
  flex-direction: column;
  height: var(--tg-viewport-stable-height, 100vh); /* Full screen height */
  width: 100%;
  box-sizing: border-box;
  
  /* Push your content 40px down to clear the native close button zone */
  padding-top: env(safe-area-inset-top, 0px);
}
      
    </style>
  </head>
  <body style="height:1000px;">
    <noscript>You need to enable JavaScript to run this app.</noscript>

   
    <div id="root"></div>

    <div>Status: fixed 5</div>
    <div id="fixed" type="text" style="width:100%;padding:0;margin:0;bacckground:white"></div>
    <div id="movel" type="text" style="width:100%;padding:0;margin:0" onclick="window.location.href='https://checkinview.com'">CV Site</div>
     
    <iframe width="560" height="315" src="https://www.youtube.com/embed/ELjzrNXhAlk?&autoplay=1"frameborder="0" allowfullscreen></iframe>
    <div id="console" type="text" style="width:100%;padding:0;margin:0;background:white">Console</div>
    <script>
      console.log('SVXPlayer connectedCallBack');
      let msg = document.getElementById("fixed");
      let msg = document.getElementById("console");
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition( pos => {
          msg.innerHTML = `Local: Lat= ${pos.coords.latitude} , Lon = ${pos.coords.longitude}`;
          console.innerHTML = JSON.stringify(Telegram.WebApp);
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          window.Telegram.WebApp.showAlert(Telegram.WebApp.isExpanded);
        }, err => { console.log("Error:", err) });
      } else { alert("I'm sorry, but geolocation services are not supported by your browser.");}
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.showAlert(Telegram.WebApp.isExpanded);
      window.Telegram.WebApp.BackButton.show();
      window.Telegram.WebApp.BackButton.onClick(() => {  // Your back navigation logic here
        window.Telegram.WebApp.BackButton.hide();
      });
    </script>
  </body>
</html>
